name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    name: Build ${{ matrix.platform }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            asset: windows-amd64.zip
            extra_flags: "-webview2 embed -nsis -installscope user"
          - os: ubuntu-24.04
            platform: linux/amd64
            asset: linux-amd64.tar.gz
            extra_flags: "-tags webkit2_41"
          - os: macos-latest
            platform: darwin/universal
            asset: darwin-universal.tar.gz
            extra_flags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev gcc pkg-config rpm

      - name: Install MinGW
        if: runner.os == 'Windows'
        run: choco install mingw -y --no-progress

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "${env:ProgramFiles(x86)}\NSIS"

      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: wails build -platform "${{ matrix.platform }}" -clean ${{ matrix.extra_flags }} -ldflags "-X pingpulse/internal/updater.Version=${{ github.ref_name }}"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/bin/PingPulse.exe -DestinationPath "PingPulse-${{ github.ref_name }}-${{ matrix.asset }}"
          $installer = Get-ChildItem build/bin/*-installer.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not created. Is makensis on PATH?" }
          Copy-Item $installer.FullName "PingPulse-${{ github.ref_name }}-windows-amd64-setup.exe"

      - name: Package Linux
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ github.ref_name }}
          NFPM_VERSION: "2.47.0"
        run: |
          set -euo pipefail
          chmod +x build/bin/PingPulse
          tar -C build/bin -czf "PingPulse-${{ github.ref_name }}-linux-amd64.tar.gz" PingPulse
          if [ ! -f build/appicon.png ]; then
            go run ./scripts/genicon.go
          fi
          curl -sSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C "$(go env GOPATH)/bin" nfpm
          nfpm --version
          export VERSION="${VERSION#v}"
          nfpm package --config build/linux/nfpm.yaml --packager deb --target "PingPulse-${{ github.ref_name }}-linux-amd64.deb"
          nfpm package --config build/linux/nfpm.yaml --packager rpm --target "PingPulse-${{ github.ref_name }}-linux-amd64.rpm"

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          tar -C build/bin -czf "PingPulse-${{ github.ref_name }}-darwin-universal.tar.gz" PingPulse.app
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/PingPulse"
          cp -R build/bin/PingPulse.app "$STAGE/PingPulse/"
          ln -s /Applications "$STAGE/PingPulse/Applications"
          hdiutil create -volname PingPulse -srcfolder "$STAGE/PingPulse" -ov -format UDZO "PingPulse-${{ github.ref_name }}-darwin-universal.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PingPulse-${{ github.ref_name }}-${{ matrix.asset }}
          path: PingPulse-${{ github.ref_name }}-${{ matrix.asset }}
          if-no-files-found: error

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: PingPulse-${{ github.ref_name }}-windows-amd64-setup.exe
          path: PingPulse-${{ github.ref_name }}-windows-amd64-setup.exe
          if-no-files-found: error

      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: PingPulse-${{ github.ref_name }}-linux-packages
          path: |
            PingPulse-${{ github.ref_name }}-linux-amd64.deb
            PingPulse-${{ github.ref_name }}-linux-amd64.rpm
          if-no-files-found: error

      - name: Upload macOS disk image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: PingPulse-${{ github.ref_name }}-darwin-universal.dmg
          path: PingPulse-${{ github.ref_name }}-darwin-universal.dmg
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: PingPulse ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: dist/*
          body: |
            Desktop builds of PingPulse for this tag.

            **Upgrading from v1.x:** install this build by hand. In-app update only works after you are already on a release that contains the updater.

            Verify downloads against `SHA256SUMS.txt` in this release.

            Builds are **not code-signed**. Windows SmartScreen and macOS Gatekeeper may warn; that is expected until a paid signing certificate / Apple notarization is in place.

            ### Windows
            Download `PingPulse-${{ github.ref_name }}-windows-amd64-setup.exe` and run it. That installs PingPulse under `%LOCALAPPDATA%\Programs\PingPulse`, adds Start Menu / desktop shortcuts, and registers Uninstall. Later in-app updates replace that installed copy.

            Do not live out of the `.zip` unless you are debugging. The zip is what the in-app updater downloads.

            ### macOS
            Download `PingPulse-${{ github.ref_name }}-darwin-universal.dmg`, open it, and drag `PingPulse.app` to Applications.

            These builds are unsigned, so macOS Gatekeeper will block the first launch. That is expected:

            1. Click **Done** on the warning — not Move to Trash.
            2. Open **System Settings → Privacy & Security**.
            3. Under **Security**, click **Open Anyway** next to PingPulse.
            4. Open `PingPulse.app` again.

            Or in Terminal:

            ```bash
            xattr -cr /Applications/PingPulse.app
            open /Applications/PingPulse.app
            ```

            The `.tar.gz` is only what Settings → Install update downloads later. In-app update needs the app to live in a writable folder (Applications is the usual place). Running it from a read-only disk image will not self-replace.

            ### Linux
            This build targets WebKitGTK 4.1 (Ubuntu 24.04+, Fedora 40+, Debian 12+).

            **Debian / Ubuntu**

            ```bash
            sudo apt install ./PingPulse-${{ github.ref_name }}-linux-amd64.deb
            pingpulse
            ```

            **Fedora / RHEL-like**

            ```bash
            sudo dnf install ./PingPulse-${{ github.ref_name }}-linux-amd64.rpm
            pingpulse
            ```

            The package puts the binary in `/opt/pingpulse`, a desktop entry, and a `pingpulse` command. Later in-app updates open the new `.deb` or `.rpm` for you to install.

            The `.tar.gz` is a portable copy for a writable folder such as `~/.local/bin`. In-app update can replace that copy directly.
