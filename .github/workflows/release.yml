name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            asset: windows-amd64.zip
            extra_flags: "-webview2 embed"
          - os: ubuntu-24.04
            platform: linux/amd64
            asset: linux-amd64.tar.gz
            extra_flags: "-tags webkit2_41"
          - os: macos-latest
            platform: darwin/universal
            asset: darwin-universal.tar.gz
            extra_flags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev gcc pkg-config

      - name: Install MinGW
        if: runner.os == 'Windows'
        run: choco install mingw -y --no-progress

      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: wails build -platform "${{ matrix.platform }}" -clean ${{ matrix.extra_flags }} -ldflags "-X pingpulse/internal/updater.Version=${{ github.ref_name }}"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/bin/PingPulse.exe -DestinationPath "PingPulse-${{ github.ref_name }}-${{ matrix.asset }}"

      - name: Package Linux
        if: runner.os == 'Linux'
        run: tar -C build/bin -czf "PingPulse-${{ github.ref_name }}-${{ matrix.asset }}" PingPulse

      - name: Package macOS
        if: runner.os == 'macOS'
        run: tar -C build/bin -czf "PingPulse-${{ github.ref_name }}-${{ matrix.asset }}" PingPulse.app

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PingPulse-${{ github.ref_name }}-${{ matrix.asset }}
          path: PingPulse-${{ github.ref_name }}-${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: PingPulse ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: dist/*
          body: |
            Desktop builds of PingPulse for this tag.

            ### Windows
            Download `PingPulse-${{ github.ref_name }}-windows-amd64.zip`, extract it, and run `PingPulse.exe`.

            ### macOS
            Download `PingPulse-${{ github.ref_name }}-darwin-universal.tar.gz`, extract it, and open `PingPulse.app`.

            These builds are unsigned, so macOS Gatekeeper will block the first launch. That is expected:

            1. Click **Done** on the warning — not Move to Trash.
            2. Open **System Settings → Privacy & Security**.
            3. Under **Security**, click **Open Anyway** next to PingPulse.
            4. Open `PingPulse.app` again.

            Or in Terminal:

            ```bash
            xattr -cr ~/Downloads/PingPulse.app
            open ~/Downloads/PingPulse.app
            ```

            ### Linux
            This build targets WebKitGTK 4.1 (Ubuntu 24.04+, Fedora 40+, Debian 12+).

            Install the runtime libraries, then extract and run:

            ```bash
            # Debian / Ubuntu 24.04+
            sudo apt install libgtk-3-0 libwebkit2gtk-4.1-0

            # Fedora 40+
            sudo dnf install gtk3 webkit2gtk4.1

            tar -xzf PingPulse-${{ github.ref_name }}-linux-amd64.tar.gz
            chmod +x PingPulse
            ./PingPulse
            ```
