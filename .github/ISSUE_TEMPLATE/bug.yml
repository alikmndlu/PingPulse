name: Bug report
description: Something is broken in a packaged or development build.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A packaged-build repro is much more useful than `wails dev` alone.
        Security issues go to [SECURITY.md](https://github.com/alikmndlu/PingPulse/blob/main/SECURITY.md), not here.
  - type: dropdown
    id: version
    attributes:
      label: PingPulse version
      options:
        - "2.1.2"
        - "2.1.1"
        - "2.0.0"
        - Development (`wails dev`)
        - Other (specify in the description)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: How was it installed?
      placeholder: Windows setup.exe / macOS DMG / Linux .deb or .rpm / tarball / wails dev
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Settings → Open log file. Redact tokens and API keys before pasting.
